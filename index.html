<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        background: #000;
      }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <!-- Website Meta Description -->
    <meta
      name="description"
      content="Paridhi Garg is a creative technologist currently based in New
    York. She recently graduated with a Bachelor's in Design and Technology from 
    Parsons School of Design. Her work often finds itself at the intersections of human
    behaviors, design and technology as it informs digital interactions and
    immersive experiences."
    />
    <!-- Faster loading by preconnecting to Google Fonts and Google Tag Manager -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Quicksand:wght@300..700&display=swap"
    />

    <!-- Preloading critical resources for faster loading -->
    <link rel="preload" href="./public/assets/videos/moveabit.mp4" as="video" />
    <link
      rel="preload"
      href="./public/assets/videos/grannybytes.gif"
      as="image"
    />
    <link rel="preload" href="./navbar.css" as="style" />
    <link rel="preload" href="./homepage.css" as="style" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.paridhiworks.com/" />
    <meta
      property="og:title"
      content="Paridhi Garg - Creative Technologist & Experiential Designer"
    />
    <meta
      property="og:description"
      content="Paridhi Garg is a creative technologist and experiential designer based in New York. Creating interactive projects at the confluence of human behavior, technology, and environment."
    />
    <meta
      property="og:image"
      content="https://www.paridhiworks.com/public/assets/images/about/main3.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="Paridhi's Portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Paridhi Garg - Creative Technologist & Experiential Designer"
    />
    <meta
      name="twitter:description"
      content="Paridhi Garg is a creative technologist and experiential designer based in New York. Creating interactive projects at the confluence of human behavior, technology, and environment."
    />
    <meta
      name="twitter:image"
      content="https://www.paridhiworks.com/public/assets/images/about/main3.png"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./navbar.css" />
    <link rel="stylesheet" href="./homepage.css" />

    <!-- Website Favicon and Title -->
    <link
      rel="icon"
      type="image/x-icon"
      href="./public/assets/images/logos/favicon.ico"
    />
    <title>Paridhi Garg</title>
  </head>
  <!-- Google Analytics -->
  <!-- Google tag (gtag.js) -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-6F7Y5HSK0Z"
  ></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());

    gtag("config", "G-6F7Y5HSK0Z");
  </script>

  <body class="home-page">
    <!-- Navigation is generated by the navbar.js file -->
    <!-- Welcome Section -->
    <section class="welcome-section">
      <h1 class="welcome-title">
        <span class="title-text">
          <span style="color: var(--text-color)"
            >I'm Paridhi — a creative technologist
          </span>
          <span style="color: var(--secondary-text-color)"
            >based in New York, designing and developing interactive interfaces
            and experiences.</span
          >
        </span>
      </h1>
    </section>

    <!-- Featured Projects Section -->
    <section class="featured-projects-section">
      <p class="featured-projects-category">Featured Projects</p>
      
      <!-- Accordion Container -->
      <div class="featured-projects-accordion" id="projects-accordion">
        <!-- Cards will be injected here by JS -->
      </div>
      <div class="view-all-projects-container">
        <a href="./public/projects.html" class="nav-button projects-button"
          >View All Projects</a
        >
      </div>
    </section>

    <script src="./public/navbar.js"></script>
    <script src="./script.js"></script>
    <script src="./homepage.js"></script>
  </body>
</html>

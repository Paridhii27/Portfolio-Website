<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        background: #000;
      }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <link rel="canonical" href="https://www.paridhiworks.com/" />
    <!-- Website Meta Description -->
    <meta
      name="description"
      content="Paridhi Garg — creative technologist based in New York; Parsons School of Design, BFA Design & Technology. Designs and builds interactive installations, AI-driven interfaces, and narrative 3D worlds that translate complex systems into human-scale experiences. Collaborations include IBM Quantum and DLR Institute for AI Safety and Security ."
    />
    <!-- Faster loading by preconnecting to Google Fonts and Google Tag Manager -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <!-- Subset fonts (homepage does not use Quicksand; avoids multi-MB variable font CSS) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Open+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap"
    />

    <!-- LCP: first accordion poster (tiny); do not preload large MP4s — they were competing with paint -->
    <link
      rel="preload"
      href="./public/assets/images/thumbnails/move-a-bit.jpg"
      as="image"
      fetchpriority="high"
    />
    <link rel="preload" href="./navbar.css" as="style" />
    <link rel="preload" href="./homepage.css" as="style" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.paridhiworks.com/" />
    <meta property="og:title" content="Paridhi Garg | Creative Technologist" />
    <meta
      property="og:description"
      content="Portfolio: interactive installations, AI interfaces, and immersive worlds—work that prompts curiosity in physical space and makes complex ideas tangible. Parsons Design & Technology; based in NYC; exhibits with IBM Quantum and DLR."
    />
    <meta
      property="og:image"
      content="https://www.paridhiworks.com/public/assets/images/about/main3.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="Paridhi's Portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paridhi Garg | Creative Technologist" />
    <meta
      name="twitter:description"
      content="Portfolio: interactive installations, AI interfaces, and immersive worlds—work that prompts curiosity in physical space and makes complex ideas tangible. Parsons Design & Technology; based in NYC; exhibits with IBM Quantum and DLR."
    />
    <meta
      name="twitter:image"
      content="https://www.paridhiworks.com/public/assets/images/about/main3.png"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./navbar.css" />
    <link rel="stylesheet" href="./homepage.css" />

    <!-- Website Favicon and Title -->
    <link
      rel="icon"
      type="image/x-icon"
      href="./public/assets/images/logos/favicon.ico"
    />
    <title>Paridhi Garg</title>
  </head>
  <!-- Google Analytics -->
  <!-- Google tag (gtag.js) -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-6F7Y5HSK0Z"
  ></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());

    gtag("config", "G-6F7Y5HSK0Z");
  </script>

  <body class="home-page">
    <!-- Navigation is generated by the navbar.js file -->
    <!-- Welcome Section -->
    <section class="welcome-section">
      <h1 class="welcome-title">
        <span class="title-text">
          <span style="color: var(--text-color)"
            >I'm Paridhi — a creative technologist
          </span>
          <span style="color: var(--secondary-text-color)"
            >based in New York, designing and developing interactive interfaces
            and experiences.</span
          >
        </span>
      </h1>
    </section>

    <!-- Featured Projects Section -->
    <section class="featured-projects-section">
      <p class="featured-projects-category">Featured Work</p>

      <!-- Accordion Container -->
      <div class="featured-projects-accordion" id="projects-accordion">
        <!-- Cards will be injected here by JS -->
      </div>
      <div class="view-all-projects-container">
        <a href="./public/projects.html" class="nav-button projects-button"
          >View All Work</a
        >
      </div>
    </section>

    <script src="./public/navbar.js" defer></script>
    <script src="./script.js" defer></script>
    <script src="./homepage.js" defer></script>
  </body>
</html>
